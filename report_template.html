<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ArchiveCleaner Report</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
<table width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:20px 0;">
<tr>
<td align="center">
<table width="640" border="0" cellpadding="0" cellspacing="0" style="border:1px solid #dddddd;background-color:#ffffff;">

<!-- HEADER -->
<tr>
<td style="background-color:#0078d4;padding:20px;text-align:center;font-size:22px;color:#ffffff;font-family:'Segoe UI',Arial,sans-serif;">
ArchiveCleaner &mdash; отчет об обработке
</td>
</tr>

<!-- INFO -->
<tr>
<td style="padding:20px 20px 10px 20px;font-size:13px;color:#333333;font-family:'Segoe UI',Arial,sans-serif;">
<p style="margin:0 0 5px 0;">Дата запуска: <strong>{{TIMESTAMP}}</strong></p>
<p style="margin:0 0 5px 0;">Режим: <strong>{{MODE}}</strong></p>
<p style="margin:0 0 5px 0;">Всего удалено файлов: <strong>{{TOTAL_DELETED}}</strong></p>
</td>
</tr>

<!-- TABLE -->
<tr>
<td style="padding:10px 20px;">
<table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:12px;font-family:'Segoe UI',Arial,sans-serif;">
<thead>
<tr style="background-color:#0078d4;color:#ffffff;">
<th style="padding:8px;border:1px solid #0078d4;text-align:left;width:50%;">Папка</th>
<th style="padding:8px;border:1px solid #0078d4;text-align:left;width:50%;">Удаленный файл</th>
</tr>
</thead>
<tbody>
{{TABLE_ROWS}}
</tbody>
</table>
</td>
</tr>

<!-- SUMMARY -->
<tr>
<td style="padding:20px;">
<table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:12px;font-family:'Segoe UI',Arial,sans-serif;">
<tr style="background-color:#f0f0f0;">
<td colspan="2" style="padding:8px;border:1px solid #dddddd;font-weight:bold;font-size:14px;">Сводка</td>
</tr>
<tr>
<td style="padding:6px 8px;border:1px solid #dddddd;width:50%;">Время выполнения</td>
<td style="padding:6px 8px;border:1px solid #dddddd;width:50%;">{{DURATION}}</td>
</tr>
{{DRIVE_SPACE_ROWS}}
</table>
</td>
</tr>

<!-- FOOTER -->
<tr>
<td style="background-color:#f0f0f0;padding:12px;text-align:center;font-size:11px;color:#888888;font-family:'Segoe UI',Arial,sans-serif;">
ArchiveCleaner &mdash; автоматический отчет
</td>
</tr>

</table>
</td>
</tr>
</table>
</body>
</html>
