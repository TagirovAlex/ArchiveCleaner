<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #333;
    padding: 20px;
    margin: 0;
}
.container {
    border-collapse: collapse;
    width: 640px;
    max-width: 100%;
}
h2 {
    margin: 0 0 12px 0;
    font-size: 18px;
    color: #0078d4;
}
.status {
    font-size: 13px;
    margin: 0 0 4px 0;
}
.data-table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 14px;
}
.data-table td, .data-table th {
    padding: 4px 8px;
    border: 1px solid #ddd;
    text-align: left;
    vertical-align: top;
    font-size: 12px;
}
.data-table th {
    background-color: #f5f5f5;
    font-weight: 600;
    white-space: nowrap;
    width: 200px;
}
.footer {
    margin-top: 14px;
    font-size: 11px;
    color: #888;
}
.records-table {
    border-collapse: collapse;
    width: 100%;
}
.records-table td, .records-table th {
    padding: 4px 8px;
    border: 1px solid #ddd;
    text-align: left;
    font-size: 12px;
}
.records-table th {
    background-color: #0078d4;
    color: #fff;
    font-weight: 600;
}
.records-table tr:nth-child(even) td {
    background-color: #f9f9f9;
}
</style>
</head>
<body>
<table class="container" cellpadding="0" cellspacing="0">
<tr><td>
<h2>ArchiveCleaner &mdash; отчёт об обработке</h2>
<p class="status">Дата запуска: <b>{TIMESTAMP}</b></p>
<p class="status">Режим: <b>{MODE}</b></p>
<p class="status">Удалено файлов: <b>{TOTAL_DELETED}</b></p>
<br>

<table class="records-table" cellpadding="0" cellspacing="0">
<thead>
<tr><th>Папка</th><th>Удалённый файл</th></tr>
</thead>
<tbody>
{TABLE_ROWS}
</tbody>
</table>

<table class="data-table" cellpadding="0" cellspacing="0">
<tr><th>Время выполнения</th><td>{DURATION}</td></tr>
{DRIVE_SPACE_ROWS}
</table>

<p class="footer">Данное сообщение сгенерировано автоматически утилитой ArchiveCleaner</p>
</td></tr>
</table>
</body>
</html>
